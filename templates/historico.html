<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8f1515">

    <title>Histórico de Pedidos - Família Monaci</title>

    <style>
        * { box-sizing: border-box; }

        :root {
            --vermelho: #c62828;
            --vermelho-escuro: #8f1515;
            --vermelho-profundo: #6f1010;
            --amarelo: #ffd600;
            --fundo: #f5f2ed;
            --branco: #ffffff;
            --texto: #242424;
            --texto-suave: #6e6e6e;
            --borda: #e8e1da;
            --verde: #2e7d32;
            --verde-claro: #eaf6ec;
            --sombra: 0 10px 28px rgba(0, 0, 0, .07);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 92% 0%, rgba(198,40,40,.05), transparent 22%),
                linear-gradient(180deg, #faf8f5 0%, var(--fundo) 100%);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
        }

        button, input, a {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            color: white;
            background:
                radial-gradient(circle at 88% 0%, rgba(255,214,0,.18), transparent 28%),
                linear-gradient(135deg, var(--vermelho-profundo), #a91818 52%, #cf2b2b);
            padding: 20px;
            box-shadow: 0 10px 30px rgba(111,16,16,.22);
        }

        .cabecalho-interno {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 66px;
            height: 66px;
            flex: 0 0 66px;
            padding: 4px;
            overflow: hidden;
            border-radius: 16px;
            background: white;
            box-shadow: 0 7px 20px rgba(0,0,0,.18);
        }

        .logo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            border-radius: 12px;
        }

        .marca small {
            display: block;
            margin-bottom: 4px;
            color: rgba(255,255,255,.74);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .marca h1 {
            margin: 0;
            color: var(--amarelo);
            font-size: 28px;
            line-height: 1;
            letter-spacing: -.6px;
        }

        .marca p {
            margin: 6px 0 0;
            color: rgba(255,255,255,.9);
            font-size: 13px;
            font-weight: 700;
        }

        .cabecalho-tag {
            padding: 9px 12px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 999px;
            background: rgba(255,255,255,.10);
            font-size: 12px;
            font-weight: 800;
        }

        main {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 24px 18px 40px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .titulo span {
            display: block;
            margin-bottom: 4px;
            color: var(--vermelho);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .titulo h2 {
            margin: 0;
            font-size: 27px;
            letter-spacing: -.6px;
        }

        .titulo p {
            margin: 6px 0 0;
            color: var(--texto-suave);
            font-size: 13px;
        }

        .acoes-topo {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .botao {
            min-height: 42px;
            border: 0;
            padding: 0 15px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform .15s ease, opacity .15s ease;
        }

        .botao:hover { opacity: .92; }
        .botao:active { transform: scale(.98); }

        .botao-voltar {
            background: #2d2d2d;
            color: white;
        }

        .botao-atualizar {
            background: linear-gradient(135deg, var(--vermelho), var(--vermelho-escuro));
            color: white;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .card-resumo {
            padding: 18px;
            border: 1px solid var(--borda);
            border-radius: 17px;
            background: white;
            box-shadow: var(--sombra);
        }

        .card-resumo span {
            display: block;
            margin-bottom: 8px;
            color: var(--texto-suave);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .card-resumo strong {
            font-size: 28px;
            letter-spacing: -.6px;
        }

        .card-resumo.total strong { color: var(--verde); }

        .filtros {
            margin-bottom: 18px;
            padding: 16px;
            border: 1px solid var(--borda);
            border-radius: 17px;
            background: white;
            box-shadow: 0 5px 18px rgba(0,0,0,.04);
        }

        .filtros-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo label {
            color: #444;
            font-size: 12px;
            font-weight: 800;
        }

        .campo input {
            width: 100%;
            min-height: 43px;
            padding: 10px 12px;
            border: 1px solid #ddd6d0;
            border-radius: 10px;
            background: #fff;
            outline: none;
            color: var(--texto);
            font-size: 14px;
        }

        .campo input:focus {
            border-color: var(--vermelho);
            box-shadow: 0 0 0 3px rgba(198,40,40,.08);
        }

        .lista {
            display: grid;
            gap: 14px;
        }

        .pedido {
            padding: 18px;
            border: 1px solid var(--borda);
            border-top: 5px solid var(--verde);
            border-radius: 17px;
            background: white;
            box-shadow: var(--sombra);
        }

        .pedido-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .numero {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -.3px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--verde-claro);
            color: #236b29;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .dados {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 8px 18px;
            margin-bottom: 14px;
            color: #484848;
            font-size: 13px;
            line-height: 1.5;
        }

        .pedido h3 {
            margin: 13px 0 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .45px;
        }

        .itens {
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid #eee7e1;
            border-radius: 11px;
            background: #fbfaf8;
        }

        .item {
            padding: 9px 0;
            border-bottom: 1px dashed #ddd5cf;
        }

        .item:last-child { border-bottom: 0; }

        .item-nome {
            font-size: 13.5px;
            font-weight: 900;
        }

        .detalhe {
            margin: 4px 0 0 10px;
            color: #5c5c5c;
            font-size: 12px;
            line-height: 1.4;
        }

        .observacao {
            margin-top: 6px;
            padding: 6px 8px;
            border-radius: 7px;
            background: #fff3cd;
            color: #684f00;
            font-weight: 900;
        }

        .horarios {
            margin-top: 11px;
            padding: 9px 10px;
            border-radius: 9px;
            background: #f5f3f0;
            color: #656565;
            font-size: 11px;
            line-height: 1.5;
        }

        .vazio,
        .erro {
            padding: 28px 18px;
            border-radius: 14px;
            text-align: center;
        }

        .vazio {
            border: 1px dashed #ddd4cd;
            background: rgba(255,255,255,.78);
            color: #777;
        }

        .erro {
            border: 1px solid #efb4b4;
            background: #fff0f0;
            color: #9b1c1c;
            font-weight: 700;
        }

        @media (max-width: 800px) {
            header { padding: 15px 13px; }
            .logo { width: 56px; height: 56px; flex-basis: 56px; border-radius: 13px; }
            .marca h1 { font-size: 23px; }
            .marca p { font-size: 12px; }
            .cabecalho-tag { display: none; }
            main { padding: 17px 10px 30px; }

            .topo {
                align-items: stretch;
                flex-direction: column;
            }

            .titulo h2 { font-size: 23px; }

            .acoes-topo {
                display: grid;
                grid-template-columns: 1fr;
            }

            .resumo,
            .dados,
            .filtros-grid {
                grid-template-columns: 1fr;
            }

            .pedido { padding: 15px; }
        }
    </style>
</head>

<body>

<header>
    <div class="cabecalho-interno">
        <div class="marca">
            <div class="logo">
                <img
                    src="{{ url_for('static', filename='images/logo_monaci.jpg') }}"
                    alt="Logo Família Monaci"
                >
            </div>

            <div>
                <small>Operação Família Monaci</small>
                <h1>Histórico de Pedidos</h1>
                <p>Consulta dos pedidos finalizados</p>
            </div>
        </div>

        <div class="cabecalho-tag">
            📋 Registro da operação
        </div>
    </div>
</header>

<main>

    <div class="topo">

        <div class="titulo">
            <span>Histórico</span>
            <h2>Pedidos finalizados</h2>
            <p>Consulte pedidos, valores e detalhes de preparo.</p>
        </div>

        <div class="acoes-topo">

            <a
                href="/painel"
                class="botao botao-voltar"
            >
                ← Voltar ao painel
            </a>

            <button
                type="button"
                class="botao botao-atualizar"
                onclick="carregarHistorico()"
            >
                ↻ Atualizar histórico
            </button>

        </div>

    </div>

    <section class="resumo">

        <div class="card-resumo">
            <span>Pedidos finalizados</span>
            <strong id="totalPedidos">0</strong>
        </div>

        <div class="card-resumo total">
            <span>Total vendido</span>
            <strong id="totalVendido">R$ 0,00</strong>
        </div>

    </section>

    <section class="filtros">

        <div class="filtros-grid">

            <div class="campo">
                <label for="busca">Buscar</label>
                <input
                    id="busca"
                    type="text"
                    placeholder="Cliente ou número do pedido"
                    oninput="aplicarFiltros()"
                >
            </div>

            <div class="campo">
                <label for="dataFiltro">Data</label>
                <input
                    id="dataFiltro"
                    type="date"
                    onchange="aplicarFiltros()"
                >
            </div>

        </div>

    </section>

    <section
        class="lista"
        id="listaHistorico"
    >
        <div class="vazio">
            Carregando histórico...
        </div>
    </section>

</main>

<script>

    let pedidosFinalizados = [];


    function escaparHtml(texto) {

        const div =
            document.createElement("div");

        div.innerText =
            texto || "";

        return div.innerHTML;
    }


    function formatarMoeda(valor) {

        return Number(
            valor || 0
        ).toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );
    }


    async function carregarHistorico() {

        const lista =
            document.getElementById(
                "listaHistorico"
            );


        lista.innerHTML =
            '<div class="vazio">Carregando histórico...</div>';


        try {

            const resposta =
                await fetch(
                    "/pedidos/finalizados"
                );


            if (
                !resposta.ok
            ) {

                throw new Error(
                    "Erro ao consultar pedidos."
                );
            }


            const pedidos =
                await resposta.json();


            pedidosFinalizados =
                Array.isArray(
                    pedidos
                )
                    ? pedidos
                    : [];


            aplicarFiltros();


        } catch (erro) {

            console.error(
                erro
            );


            lista.innerHTML =
                '<div class="erro">' +
                "Não foi possível carregar o histórico." +
                "</div>";
        }
    }


    function aplicarFiltros() {

        const busca =
            document.getElementById(
                "busca"
            ).value
                .trim()
                .toLowerCase();


        const dataFiltro =
            document.getElementById(
                "dataFiltro"
            ).value;


        let pedidosFiltrados =
            [...pedidosFinalizados];


        if (
            busca
        ) {

            pedidosFiltrados =
                pedidosFiltrados.filter(
                    pedido => {

                        const cliente =
                            String(
                                pedido.cliente || ""
                            ).toLowerCase();


                        const numero =
                            String(
                                pedido.numero || ""
                            );


                        const numeroFormatado =
                            String(
                                pedido.numero_formatado || ""
                            );


                        return (
                            cliente.includes(
                                busca
                            ) ||
                            numero.includes(
                                busca
                            ) ||
                            numeroFormatado.includes(
                                busca
                            )
                        );
                    }
                );
        }


        if (
            dataFiltro
        ) {

            const partes =
                dataFiltro.split(
                    "-"
                );


            const dataBrasil =
                partes[2] +
                "/" +
                partes[1] +
                "/" +
                partes[0];


            pedidosFiltrados =
                pedidosFiltrados.filter(
                    pedido =>
                        String(
                            pedido.data_hora || ""
                        ).startsWith(
                            dataBrasil
                        )
                );
        }


        atualizarResumo(
            pedidosFiltrados
        );


        renderizarPedidos(
            pedidosFiltrados
        );
    }


    function atualizarResumo(
        pedidos
    ) {

        const quantidade =
            pedidos.length;


        const total =
            pedidos.reduce(
                (
                    acumulado,
                    pedido
                ) =>
                    acumulado +
                    Number(
                        pedido.total || 0
                    ),
                0
            );


        document.getElementById(
            "totalPedidos"
        ).innerText =
            quantidade;


        document.getElementById(
            "totalVendido"
        ).innerText =
            formatarMoeda(
                total
            );
    }


    function renderizarPedidos(
        pedidos
    ) {

        const lista =
            document.getElementById(
                "listaHistorico"
            );


        if (
            pedidos.length === 0
        ) {

            lista.innerHTML =
                '<div class="vazio">' +
                "Nenhum pedido finalizado encontrado." +
                "</div>";

            return;
        }


        const ordenados =
            [...pedidos].sort(
                (
                    a,
                    b
                ) =>
                    Number(
                        b.numero
                    ) -
                    Number(
                        a.numero
                    )
            );


        let html = "";


        for (
            const pedido of ordenados
        ) {

            html +=
                criarPedidoHTML(
                    pedido
                );
        }


        lista.innerHTML =
            html;
    }


    function criarPedidoHTML(
        pedido
    ) {

        let itensHTML = "";


        for (
            const item of pedido.itens || []
        ) {

            itensHTML +=
                '<div class="item">';


            itensHTML +=
                '<div class="item-nome">' +
                (item.quantidade || 1) +
                "x " +
                escaparHtml(
                    item.nome
                ) +
                "</div>";


            if (
                item.molho
            ) {

                itensHTML +=
                    '<div class="detalhe">' +
                    "↳ Molho: " +
                    escaparHtml(
                        item.molho
                    ) +
                    "</div>";
            }


            if (
                item.saborSuco
            ) {

                itensHTML +=
                    '<div class="detalhe">' +
                    "↳ Sabor: " +
                    escaparHtml(
                        item.saborSuco
                    ) +
                    "</div>";
            }


            if (
                item.preparoSuco
            ) {

                itensHTML +=
                    '<div class="detalhe">' +
                    "↳ Preparo: " +
                    escaparHtml(
                        item.preparoSuco
                    ) +
                    "</div>";
            }


            if (
                item.acucarSuco
            ) {

                itensHTML +=
                    '<div class="detalhe">' +
                    "↳ Açúcar: " +
                    escaparHtml(
                        item.acucarSuco
                    ) +
                    "</div>";
            }


            if (
                Array.isArray(
                    item.retirados
                ) &&
                item.retirados.length > 0
            ) {

                itensHTML +=
                    '<div class="detalhe">' +
                    "↳ Retirar: " +
                    item.retirados
                        .map(
                            ingrediente =>
                                escaparHtml(
                                    ingrediente
                                )
                        )
                        .join(", ") +
                    "</div>";
            }


            if (
                Array.isArray(
                    item.adicionais
                ) &&
                item.adicionais.length > 0
            ) {

                itensHTML +=
                    '<div class="detalhe">' +
                    "↳ Adicionais: " +
                    item.adicionais
                        .map(
                            adicional =>
                                escaparHtml(
                                    adicional.nome
                                )
                        )
                        .join(", ") +
                    "</div>";
            }


            if (
                item.observacao
            ) {

                itensHTML +=
                    '<div class="detalhe observacao">' +
                    "↳ OBS: " +
                    escaparHtml(
                        item.observacao
                    ) +
                    "</div>";
            }


            itensHTML +=
                "</div>";
        }


        let enderecoHTML = "";


        if (
            pedido.endereco
        ) {

            enderecoHTML =
                "<div>" +
                "<strong>Endereço:</strong> " +
                escaparHtml(
                    pedido.endereco
                ) +
                "</div>";
        }


        let horariosHTML =
            '<div class="horarios">' +
            "<strong>Recebido:</strong> " +
            escaparHtml(
                pedido.data_hora
            );


        if (
            pedido.hora_inicio_preparo
        ) {

            horariosHTML +=
                "<br><strong>Início do preparo:</strong> " +
                escaparHtml(
                    pedido.hora_inicio_preparo
                );
        }


        if (
            pedido.hora_pronto
        ) {

            horariosHTML +=
                "<br><strong>Pronto:</strong> " +
                escaparHtml(
                    pedido.hora_pronto
                );
        }


        if (
            pedido.hora_saida_entrega
        ) {

            horariosHTML +=
                "<br><strong>Saiu para entrega:</strong> " +
                escaparHtml(
                    pedido.hora_saida_entrega
                );
        }


        if (
            pedido.hora_finalizado
        ) {

            horariosHTML +=
                "<br><strong>Finalizado:</strong> " +
                escaparHtml(
                    pedido.hora_finalizado
                );
        }


        horariosHTML +=
            "</div>";


        return `
            <article class="pedido">

                <div class="pedido-topo">

                    <div class="numero">
                        Pedido #${String(
                            pedido.numero
                        ).padStart(
                            4,
                            "0"
                        )}
                    </div>

                    <div class="status">
                        FINALIZADO
                    </div>

                </div>

                <div class="dados">

                    <div>
                        <strong>Cliente:</strong>
                        ${escaparHtml(
                            pedido.cliente
                        )}
                    </div>

                    <div>
                        <strong>Tipo:</strong>
                        ${
                            pedido.tipo ===
                            "entrega"
                                ? "Entrega"
                                : "Retirada"
                        }
                    </div>

                    ${enderecoHTML}

                    <div>
                        <strong>Pagamento:</strong>
                        ${escaparHtml(
                            pedido.pagamento
                        )}
                    </div>

                    <div>
                        <strong>Total:</strong>
                        ${formatarMoeda(
                            pedido.total
                        )}
                    </div>

                </div>

                <h3>Itens do pedido</h3>

                <div class="itens">
                    ${itensHTML}
                </div>

                ${horariosHTML}

            </article>
        `;
    }


    carregarHistorico();

</script>

</body>

</html>
